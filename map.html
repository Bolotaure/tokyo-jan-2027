<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tokyo events map</title>
<style>
:root{--bg:#f4efe6;--ink:#1c1915;--muted:#5c564c;--line:#e4d9c8}
*{box-sizing:border-box}
html,body{margin:0;font-family:-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:12px 14px 8px}
.kicker{color:#c45c26;font-size:11px;letter-spacing:.12em;font-weight:700}
h1{margin:4px 0 6px;font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.lbl{font-size:11px;text-transform:uppercase;color:var(--muted)}
button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px}
#list{max-height:28vh;overflow:auto;background:#fffdf8;border-top:1px solid var(--line)}
#list article{padding:10px 12px;border-bottom:1px solid var(--line)}
#list article.active{background:#f8efe4}
#list h3{margin:0 0 2px;font-size:14px}
#list .meta{font-size:12px;color:var(--muted)}
#map{height:42vh;min-height:220px;background:#cfe0d4}
.leaflet-container{height:100%;width:100%;overflow:hidden;position:relative;background:#ddd}
.pin{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
a.web{color:#c45c26;font-weight:600;font-size:13px;margin-right:12px}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-map-pane{z-index:1}.leaflet-tile-pane{z-index:2}.leaflet-overlay-pane{z-index:4}.leaflet-shadow-pane{z-index:5}.leaflet-marker-pane{z-index:6}.leaflet-tooltip-pane{z-index:7}.leaflet-popup-pane{z-index:8}
.leaflet-control{position:relative;z-index:8;pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:9;pointer-events:none}
.leaflet-top{top:0}.leaflet-left{left:0}
.leaflet-control-zoom{border:2px solid rgba(0,0,0,.2);margin:10px}
.leaflet-bar a{background:#fff;border-bottom:1px solid #ccc;display:block;width:30px;height:30px;line-height:30px;text-align:center;text-decoration:none;color:#000}
.leaflet-control-attribution,.leaflet-popup{display:none!important}
#overlay{display:none;position:fixed;inset:0;background:rgba(28,25,21,.45);z-index:50;align-items:center;justify-content:center;padding:18px}
#overlay.on{display:flex}
#card{background:#fffdf8;border-radius:16px;padding:18px 16px 16px;max-width:420px;width:100%;max-height:70vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#card h2{margin:0 0 6px;font-size:20px;line-height:1.25}
#card .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
#card .desc{font-size:15px;line-height:1.45;margin:0 0 14px}
#card .links{display:flex;flex-wrap:wrap;gap:8px}
#card .links a{background:#f4efe6;border-radius:999px;padding:8px 12px;text-decoration:none}
#card .close{float:right;border:0;background:#efe8dc;width:32px;height:32px;border-radius:50%;font-size:18px}
</style>
</head>
<body>
<header>
<div class="kicker">5–11 JANUARY 2027</div>
<h1>Event map</h1>
<div class="row"><span class="lbl">Category</span><div id="filters"></div><span id="count"></span></div>
<div class="row"><span class="lbl">Date</span><div id="dates"></div></div>
</header>
<div id="list"></div>
<div id="map"></div>
<div id="overlay">
  <div id="card"></div>
</div>
<script>
const DATA_A="https://cdn.jsdelivr.net/gh/Bolotaure/tokyo-jan-2027@main/events-a.json";
const DATA_B="https://cdn.jsdelivr.net/gh/Bolotaure/tokyo-jan-2027@main/events-b.json";
const CATS={culture:{label:"Culture",color:"#8b3a2a"},walks:{label:"Walks",color:"#6b4e2e"},games:{label:"Games",color:"#3d4f99"},kids:{label:"Kids",color:"#b4532a"},skate:{label:"Skating",color:"#1f5f7a"},lights:{label:"Lights",color:"#2a6f6b"},animals:{label:"Animals",color:"#2f6b3a"},art:{label:"teamLab",color:"#5b3d8f"},shows:{label:"Shows",color:"#7a3058"},yoko:{label:"Yokohama",color:"#0b5f7a"},kama:{label:"Kamakura",color:"#7a4a1e"},museums:{label:"Museums",color:"#4a5d8f"}};
const DAYS=[{iso:"2027-01-05",label:"Tue 5"},{iso:"2027-01-06",label:"Wed 6"},{iso:"2027-01-07",label:"Thu 7"},{iso:"2027-01-08",label:"Fri 8"},{iso:"2027-01-09",label:"Sat 9"},{iso:"2027-01-10",label:"Sun 10"},{iso:"2027-01-11",label:"Mon 11"}];
let EVENTS=[], cat="all", selected=new Set(DAYS.map(d=>d.iso)), map, layer, current=null;
const filters=document.getElementById("filters");
const dates=document.getElementById("dates");
const overlay=document.getElementById("overlay");
const card=document.getElementById("card");
function addCat(key,label,color){
  const b=document.createElement("button"); b.textContent=label;
  if(key==="all"){b.style.background="#1c1915";b.style.color="#fff"}
  b.onclick=()=>{cat=key;filters.querySelectorAll("button").forEach(x=>{x.style.background="#fff";x.style.color="#1c1915"});b.style.background=key==="all"?"#1c1915":color;b.style.color="#fff";hideCard();render()};
  filters.appendChild(b);
}
addCat("all","All","#1c1915");
Object.entries(CATS).forEach(([k,v])=>addCat(k,v.label,v.color));
const all=document.createElement("button"); all.id="allDates"; all.textContent="Whole week";
all.onclick=()=>{selected=new Set(DAYS.map(d=>d.iso));syncDates();hideCard();render()};
dates.appendChild(all);
DAYS.forEach(d=>{
  const b=document.createElement("button"); b.dataset.iso=d.iso; b.textContent=d.label;
  b.onclick=()=>{
    if(selected.size===DAYS.length) selected=new Set([d.iso]);
    else if(selected.has(d.iso)){selected.delete(d.iso); if(!selected.size) selected=new Set(DAYS.map(x=>x.iso))}
    else selected.add(d.iso);
    syncDates(); hideCard(); render();
  };
  dates.appendChild(b);
});
function paint(b,on){if(!b)return;b.style.background=on?"#1c1915":"#fff";b.style.color=on?"#fff":"#1c1915"}
function syncDates(){paint(document.getElementById("allDates"),selected.size===DAYS.length);document.querySelectorAll("#dates [data-iso]").forEach(b=>paint(b,selected.has(b.dataset.iso)))}
function overlaps(e){return DAYS.some(d=>selected.has(d.iso)&&e.start<=d.iso&&e.end>=d.iso)}
function icon(c){return L.divIcon({className:"",html:`<div class="pin" style="background:${c}"></div>`,iconSize:[14,14],iconAnchor:[7,7]})}
function linksFor(e){
  const q=encodeURIComponent(e.name);
  const apple="https://maps.apple.com/?ll="+e.lat+","+e.lng+"&q="+q;
  const gmap="https://www.google.com/maps/search/?api=1&query="+e.lat+","+e.lng;
  const site=e.url?`<a class="web" href="${e.url}" target="_blank" rel="noopener">Site</a>`:"";
  return `${site}<a class="web" href="${apple}">Plans</a><a class="web" href="${gmap}">Maps</a>`;
}
function hideCard(){
  current=null; overlay.classList.remove("on");
  document.querySelectorAll("#list article").forEach(a=>a.classList.remove("active"));
}
function showCard(e, art){
  if(current===e.name){hideCard();return}
  current=e.name;
  document.querySelectorAll("#list article").forEach(a=>a.classList.remove("active"));
  if(art){art.classList.add("active"); art.scrollIntoView({block:"nearest"})}
  card.innerHTML=`<button class="close" type="button" aria-label="Close">×</button><h2>${e.name}</h2><div class="meta">${e.when} · ${e.venue}</div><p class="desc">${e.desc||""}</p><div class="links">${linksFor(e)}</div>`;
  card.querySelector(".close").onclick=ev=>{ev.stopPropagation();hideCard()};
  overlay.classList.add("on");
  if(map) map.setView([e.lat,e.lng],14,{animate:true});
}
overlay.addEventListener("click",ev=>{if(ev.target===overlay) hideCard()});
function render(){
  if(!layer) return;
  layer.clearLayers();
  const list=document.getElementById("list"); list.innerHTML="";
  const shown=EVENTS.filter(e=>(cat==="all"||e.cat===cat)&&overlaps(e));
  document.getElementById("count").textContent=shown.length+" places";
  shown.forEach(e=>{
    const m=L.marker([e.lat,e.lng],{icon:icon(CATS[e.cat].color)}).addTo(layer);
    const art=document.createElement("article");
    if(current===e.name) art.className="active";
    art.innerHTML=`<h3>${e.name}</h3><div class="meta">${e.when} · ${e.venue}</div>`;
    art.onclick=()=>showCard(e,art);
    m.on("click",()=>showCard(e,art));
    list.appendChild(art);
  });
  if(shown.length){map.invalidateSize(); map.fitBounds(L.latLngBounds(shown.map(e=>[e.lat,e.lng])).pad(0.2))}
}
function startMap(){
  map=L.map("map").setView([35.55,139.7],9);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:""}).addTo(map);
  layer=L.layerGroup().addTo(map);
  setTimeout(()=>map.invalidateSize(),250);
  if(EVENTS.length) render();
}
syncDates();
Promise.all([
  fetch("https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js").then(r=>r.text()),
  fetch(DATA_A).then(r=>r.json()),
  fetch(DATA_B).then(r=>r.json())
]).then(([src,a,b])=>{
  (0,eval)(src);
  EVENTS=a.concat(b);
  startMap();
}).catch(err=>{
  document.getElementById("map").textContent="Map failed: "+err;
});
</script>
</body>
</html>
