<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tokyo events map</title>
<style>
:root{--bg:#f4efe6;--ink:#1c1915;--muted:#5c564c;--line:#e4d9c8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;font-family:-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column}
#top{position:relative;flex:0 0 auto;min-height:204px}
header{padding:8px 12px 4px}
.kicker{color:#c45c26;font-size:11px;letter-spacing:.12em;font-weight:700}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 0 4px}
h1{margin:0;font-size:20px}
#count{font-size:13px;color:var(--muted);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0}
.lbl{font-size:11px;text-transform:uppercase;color:var(--muted)}
button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 8px;font-size:11px}
button.off{opacity:.32;pointer-events:none}
body.card-on header{visibility:hidden}
#list{flex:0 0 174px;min-height:174px;max-height:28vh;overflow:auto;background:#fffdf8;border-top:1px solid var(--line)}
#list article{padding:8px 12px;border-bottom:1px solid var(--line)}
#list article.active{background:#f8efe4}
#list h3{margin:0 0 2px;font-size:14px}
#list .meta{font-size:12px;color:var(--muted)}
.type{font-weight:700}
#map{flex:1 1 auto;min-height:160px;background:#cfe0d4}
.leaflet-container{height:100%;width:100%;overflow:hidden;position:relative;background:#ddd}
.pinwrap,.pinhit{background:transparent}
.pinhit{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.pin{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:none}
a.web{color:#c45c26;font-weight:600;font-size:13px;margin-right:12px}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-map-pane{z-index:1}.leaflet-tile-pane{z-index:2}.leaflet-overlay-pane{z-index:4}.leaflet-shadow-pane{z-index:5}.leaflet-marker-pane{z-index:6}.leaflet-tooltip-pane{z-index:7}.leaflet-popup-pane{z-index:8}
.leaflet-control{position:relative;z-index:8;pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:9;pointer-events:none}
.leaflet-top{top:0}.leaflet-left{left:0}
.leaflet-control-zoom{border:2px solid rgba(0,0,0,.2);margin:10px}
.leaflet-bar a{background:#fff;border-bottom:1px solid #ccc;display:block;width:30px;height:30px;line-height:30px;text-align:center;text-decoration:none;color:#000}
.leaflet-control-attribution,.leaflet-popup{display:none!important}
#card{display:none;position:absolute;inset:0;background:#fff;padding:10px 12px;overflow:hidden}
#card.on{display:block}
#card h2{margin:0 0 4px;font-size:18px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card .meta{color:var(--muted);font-size:13px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card .desc{font-size:15px;line-height:1.4;height:7em;margin:0 0 10px;overflow:hidden}
#card .links{display:flex;gap:8px}
#card .links a{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#f4efe6;border-radius:50%;text-decoration:none;color:#1c1915}
#card .links svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="top">
<header>
<div class="kicker">5–11 JANUARY 2027</div>
<div class="title"><h1>Event map</h1><span id="count"></span></div>
<div class="row"><span class="lbl">Place</span><div id="places"></div></div>
<div class="row"><span class="lbl">Type</span><div id="filters"></div></div>
<div class="row"><span class="lbl">Date</span><div id="dates"></div></div>
</header>
<div id="card"></div>
</div>
<div id="list"></div>
<div id="map"></div>
<script>
const DATA_A="https://cdn.jsdelivr.net/gh/Bolotaure/tokyo-jan-2027@ca6a7d38c384ee979f38f8488b698964f034df23/events-a.json";
const DATA_B="https://cdn.jsdelivr.net/gh/Bolotaure/tokyo-jan-2027@2416116f03ead9dec70aa8826bbbcbc05c2e879f/events-b.json";
const DATA_C="https://cdn.jsdelivr.net/gh/Bolotaure/tokyo-jan-2027@5d1b51e54ece2b206eab48b4c8325684c76d33f5/events-c.json";
const DATA_D="https://cdn.jsdelivr.net/gh/Bolotaure/tokyo-jan-2027@ee1b688679a3c09461f93ed4feb49625d2486f39/events-d.json";
const DATA_E="https://cdn.jsdelivr.net/gh/Bolotaure/tokyo-jan-2027@97bf4891d6f5d5c3868d4183ecc96345a503d617/events-e.json";
const DATA_F="https://cdn.jsdelivr.net/gh/Bolotaure/tokyo-jan-2027@fb31ab01d19b98ebdb9dc2146905dc611f299122/events-f.json";
const PLACES={tokyo:{label:"Tokyo",color:"#8b3a2a"},yokohama:{label:"Yokohama",color:"#0b5f7a"},kamakura:{label:"Kamakura",color:"#7a4a1e"},chiba:{label:"Chiba",color:"#3d4f99"}};
const PLACE_KEYS=Object.keys(PLACES);
const CATS={culture:{label:"Culture",color:"#8b3a2a"},walks:{label:"Walks",color:"#6b4e2e"},games:{label:"Games",color:"#3d4f99"},kids:{label:"Kids",color:"#b4532a"},skate:{label:"Skating",color:"#1f5f7a"},lights:{label:"Lights",color:"#2a6f6b"},animals:{label:"Animals",color:"#2f6b3a"},shows:{label:"Shows",color:"#7a3058"},museums:{label:"Museums",color:"#4a5d8f"},immersive:{label:"Immersive",color:"#6b3fa0"},food:{label:"Food",color:"#b4532a"},views:{label:"Views",color:"#1f5f7a"}};
const CAT_KEYS=Object.keys(CATS);
const DAYS=[{iso:"2027-01-05",label:"Tue 5"},{iso:"2027-01-06",label:"Wed 6"},{iso:"2027-01-07",label:"Thu 7"},{iso:"2027-01-08",label:"Fri 8"},{iso:"2027-01-09",label:"Sat 9"},{iso:"2027-01-10",label:"Sun 10"},{iso:"2027-01-11",label:"Mon 11"}];
let EVENTS=[], places=new Set(PLACE_KEYS), cats=new Set(CAT_KEYS), selected=new Set(DAYS.map(d=>d.iso)), map, layer, current=null;
const placeBox=document.getElementById("places");
const filters=document.getElementById("filters");
const dates=document.getElementById("dates");
const card=document.getElementById("card");
function paint(b,on,color){
  if(!b) return;
  b.style.background=on?(color||"#1c1915"):"#fff";
  b.style.color=on?"#fff":"#1c1915";
  b.style.borderColor=on?(color||"#1c1915"):"";
}
function syncPlaces(){
  paint(document.getElementById("allPlaces"),places.size===PLACE_KEYS.length);
  placeBox.querySelectorAll("[data-place]").forEach(b=>{
    const on=places.has(b.dataset.place);
    const ok=!EVENTS.length||placeRelevant(b.dataset.place);
    b.classList.toggle("off",!ok);
    paint(b,on&&ok,PLACES[b.dataset.place].color);
  });
}
function syncCats(){
  paint(document.getElementById("allCats"),cats.size===CAT_KEYS.length);
  filters.querySelectorAll("[data-cat]").forEach(b=>{
    const on=cats.has(b.dataset.cat);
    const ok=!EVENTS.length||typeRelevant(b.dataset.cat);
    b.classList.toggle("off",!ok);
    paint(b,on&&ok,CATS[b.dataset.cat].color);
  });
}
const allPlace=document.createElement("button"); allPlace.id="allPlaces"; allPlace.textContent="All";
allPlace.onclick=()=>{places=new Set(PLACE_KEYS);prune();syncPlaces();syncCats();syncDates();hideCard();render()};
placeBox.appendChild(allPlace);
PLACE_KEYS.forEach(key=>{
  const b=document.createElement("button"); b.dataset.place=key; b.textContent=PLACES[key].label;
  b.onclick=()=>{
    if(places.size===PLACE_KEYS.length) places=new Set([key]);
    else if(places.has(key)){places.delete(key); if(!places.size) places=new Set(PLACE_KEYS)}
    else places.add(key);
    prune();syncPlaces();syncCats();syncDates();hideCard();render();
  };
  placeBox.appendChild(b);
});
const allCat=document.createElement("button"); allCat.id="allCats"; allCat.textContent="All";
allCat.onclick=()=>{cats=new Set(CAT_KEYS);prune();syncPlaces();syncCats();syncDates();hideCard();render()};
filters.appendChild(allCat);
CAT_KEYS.forEach(key=>{
  const b=document.createElement("button"); b.dataset.cat=key; b.textContent=CATS[key].label;
  b.onclick=()=>{
    if(cats.size===CAT_KEYS.length) cats=new Set([key]);
    else if(cats.has(key)){cats.delete(key); if(!cats.size) cats=new Set(CAT_KEYS)}
    else cats.add(key);
    prune();syncPlaces();syncCats();syncDates();hideCard();render();
  };
  filters.appendChild(b);
});
const all=document.createElement("button"); all.id="allDates"; all.textContent="Whole week";
all.onclick=()=>{selected=new Set(DAYS.map(d=>d.iso));prune();syncPlaces();syncCats();syncDates();hideCard();render()};
dates.appendChild(all);
DAYS.forEach(d=>{
  const b=document.createElement("button"); b.dataset.iso=d.iso; b.textContent=d.label;
  b.onclick=()=>{
    if(selected.size===DAYS.length) selected=new Set([d.iso]);
    else if(selected.has(d.iso)){selected.delete(d.iso); if(!selected.size) selected=new Set(DAYS.map(x=>x.iso))}
    else selected.add(d.iso);
    prune();syncPlaces();syncCats();syncDates();hideCard();render();
  };
  dates.appendChild(b);
});
function syncDates(){
  paint(document.getElementById("allDates"),selected.size===DAYS.length);
  document.querySelectorAll("#dates [data-iso]").forEach(b=>{
    const on=selected.has(b.dataset.iso);
    const ok=!EVENTS.length||dateRelevant(b.dataset.iso);
    b.classList.toggle("off",!ok);
    paint(b,on&&ok);
  });
}
function overlaps(e){return DAYS.some(d=>selected.has(d.iso)&&e.start<=d.iso&&e.end>=d.iso)}
function typeRelevant(key){return EVENTS.some(e=>places.has(placeOf(e))&&typeOf(e)===key&&overlaps(e))}
function dateRelevant(iso){return EVENTS.some(e=>places.has(placeOf(e))&&cats.has(typeOf(e))&&e.start<=iso&&e.end>=iso)}
function placeRelevant(key){return EVENTS.some(e=>placeOf(e)===key&&cats.has(typeOf(e))&&overlaps(e))}
function prune(){
  if(EVENTS.length){
    if(cats.size!==CAT_KEYS.length){CAT_KEYS.forEach(k=>{if(!typeRelevant(k)) cats.delete(k)}); if(!cats.size) cats=new Set(CAT_KEYS)}
    if(selected.size!==DAYS.length){DAYS.forEach(d=>{if(!dateRelevant(d.iso)) selected.delete(d.iso)}); if(!selected.size) selected=new Set(DAYS.map(x=>x.iso))}
    if(places.size!==PLACE_KEYS.length){PLACE_KEYS.forEach(k=>{if(!placeRelevant(k)) places.delete(k)}); if(!places.size) places=new Set(PLACE_KEYS)}
  }
}
function placeOf(e){return e.place||(e.cat==="yoko"?"yokohama":e.cat==="kama"?"kamakura":"tokyo")}
function typeOf(e){return CATS[e.cat]?e.cat:"culture"}
function typeMeta(e){
  const t=typeOf(e);
  const c=CATS[t]||CATS.culture;
  return `<span class="type" style="color:${c.color}">${c.label}</span>`;
}
function icon(c){return L.divIcon({className:"pinwrap",html:`<div class="pinhit"><div class="pin" style="background:${c}"></div></div>`,iconSize:[44,44],iconAnchor:[22,22]})}
function linksFor(e){
  const q=encodeURIComponent(e.name);
  const apple="https://maps.apple.com/?ll="+e.lat+","+e.lng+"&q="+q;
  const gmap="https://www.google.com/maps/search/?api=1&query="+e.lat+","+e.lng;
  const globe='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>';
  const nav='<svg viewBox="0 0 24 24"><path d="M12 3l8 18-8-4-8 4z"/></svg>';
  const pin='<svg viewBox="0 0 24 24"><path d="M12 22s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.2"/></svg>';
  const site=e.url?`<a class="web" href="${e.url}" target="_blank" rel="noopener" title="Site">${globe}</a>`:"";
  return `${site}<a class="web" href="${apple}" title="Plans">${nav}</a><a class="web" href="${gmap}" title="Maps">${pin}</a>`;
}
function visibleEvents(){return EVENTS.filter(e=>places.has(placeOf(e))&&cats.has(typeOf(e))&&overlaps(e))}
function fitVisible(){
  if(!map) return;
  const shown=visibleEvents();
  if(!shown.length) return;
  map.invalidateSize();
  map.fitBounds(L.latLngBounds(shown.map(e=>[e.lat,e.lng])).pad(0.2));
}
function hideCard(){
  current=null; card.classList.remove("on"); card.innerHTML=""; document.body.classList.remove("card-on");
  document.querySelectorAll("#list article").forEach(a=>a.classList.remove("active"));
  if(map){map.invalidateSize();}
  fitVisible();
}
function showCard(e, art){
  if(current===e.name){hideCard();return}
  current=e.name;
  document.querySelectorAll("#list article").forEach(a=>a.classList.remove("active"));
  if(art){art.classList.add("active"); art.scrollIntoView({block:"nearest"})}
  const loc=PLACES[placeOf(e)]?PLACES[placeOf(e)].label:"";
  card.innerHTML=`<h2>${e.name}</h2><div class="meta">${typeMeta(e)} · ${e.when} · ${loc} · ${e.venue}</div><p class="desc">${(e.desc||"").replace(/\n+/g," ")}</p><div class="links">${linksFor(e)}</div>`;
  card.querySelectorAll("a").forEach(a=>a.addEventListener("click",ev=>ev.stopPropagation()));
  card.classList.add("on"); document.body.classList.add("card-on");
  if(map){requestAnimationFrame(()=>{map.invalidateSize(); map.setView([e.lat,e.lng],14,{animate:true});});}
}
card.addEventListener("click",ev=>{if(ev.target.closest("a")) return; hideCard()});
function render(){
  if(!layer) return;
  layer.clearLayers();
  const list=document.getElementById("list"); list.innerHTML="";
  const shown=visibleEvents();
  document.getElementById("count").textContent=shown.length+" places";
  shown.forEach(e=>{
    const t=typeOf(e);
    const m=L.marker([e.lat,e.lng],{icon:icon((CATS[t]||CATS.culture).color),riseOnHover:true,keyboard:true}).addTo(layer);
    const art=document.createElement("article");
    if(current===e.name) art.className="active";
    const loc=PLACES[placeOf(e)]?PLACES[placeOf(e)].label:"";
    art.innerHTML=`<h3>${e.name}</h3><div class="meta">${typeMeta(e)} · ${e.when} · ${loc} · ${e.venue}</div>`;
    art.onclick=()=>showCard(e,art);
    m.on("click",ev=>{L.DomEvent.stopPropagation(ev); showCard(e,art);});
    list.appendChild(art);
  });
  if(shown.length) fitVisible();
}
function startMap(){
  map=L.map("map",{tap:true,tapTolerance:28,bounceAtZoomLimits:false}).setView([35.55,139.7],9);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:""}).addTo(map);
  layer=L.layerGroup().addTo(map);
  setTimeout(()=>map.invalidateSize(),250);
  if(EVENTS.length) render();
}
prune(); syncPlaces(); syncCats(); syncDates();
Promise.all([
  fetch("https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js").then(r=>r.text()),
  fetch(DATA_A).then(r=>r.json()),
  fetch(DATA_B).then(r=>r.json()),
  fetch(DATA_C).then(r=>r.json()),
  fetch(DATA_D).then(r=>r.json()),
  fetch(DATA_E).then(r=>r.json()),
  fetch(DATA_F).then(r=>r.json())
]).then(([src,a,b,c,d,e,f])=>{
  (0,eval)(src);
  EVENTS=a.concat(b,c,d,e,f);
  prune();syncPlaces();syncCats();syncDates();
  startMap();
}).catch(err=>{
  document.getElementById("map").textContent="Map failed: "+err;
});
</script>
</body>
</html>
